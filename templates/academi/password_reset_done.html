{% extends 'partials/base.html' %}

{% block title %}Correo enviado - AcadEMI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center p-5">
                    <i class="fas fa-envelope fa-3x" style="color: var(--success);"></i>
                    <h3 class="mt-3 fw-bold">¡Correo enviado!</h3>
                    <p class="text-muted">Hemos enviado un enlace de recuperación a tu correo electrónico.</p>
                    <p class="text-muted small">Revisa tu bandeja de entrada y sigue las instrucciones.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary mt-3">
                        <i class="fas fa-arrow-left me-2"></i> Volver al inicio de sesión
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

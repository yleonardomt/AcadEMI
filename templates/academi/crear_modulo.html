{% extends 'partials/base.html' %}

{% block title %}Crear módulo - {{ course.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-folder-plus fa-2x" style="color: var(--primary);"></i>
                        <h4 class="mt-2 fw-bold">Crear módulo</h4>
                        <p class="text-muted">Para el curso: <strong>{{ course.title }}</strong></p>
                    </div>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Título del módulo <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" placeholder="Ej: Introducción" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <textarea name="description" class="form-control" rows="3" placeholder="Describe el contenido del módulo"></textarea>
                        </div>
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="fas fa-save"></i> Crear módulo
                            </button>
                            <a href="{% url 'manage_course' course.id %}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'partials/base.html' %}

{% block title %}Restablecer contraseña - Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-key" style="font-size: 48px; color: var(--warning);"></i>
                        <h3 class="mt-3 fw-bold">Restablecer contraseña</h3>
                        <p class="text-muted">Nueva contraseña para <strong>{{ reset_user.username }}</strong></p>
                    </div>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nueva contraseña</label>
                            <input type="text" name="new_password" class="form-control" required>
                            <div class="form-text">Mínimo 8 caracteres</div>
                        </div>
                        
                        <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">
                            <i class="fas fa-sync me-2"></i> Restablecer contraseña
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="{% url 'admin_users' %}" class="text-muted">
                            <i class="fas fa-arrow-left me-1"></i> Volver a la lista
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

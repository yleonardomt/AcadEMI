{% extends 'partials/base.html' %}

{% block title %}Crear usuario - Admin{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus" style="font-size: 48px; color: var(--primary);"></i>
                        <h3 class="mt-3 fw-bold">Crear usuario</h3>
                        <p class="text-muted">Añade un nuevo usuario a la plataforma</p>
                    </div>
                    
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de usuario</label>
                            <input type="text" name="username" class="form-control" value="{{ request.POST.username|default:'' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ request.POST.email|default:'' }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre completo</label>
                            <input type="text" name="first_name" class="form-control" value="{{ request.POST.first_name|default:'' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="text" name="phone" class="form-control" placeholder="Ej: 79123456" value="{{ request.POST.phone|default:'' }}">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Rol</label>
                            <select name="role" class="form-control">
                                <option value="student" {% if request.POST.role == 'student' or not request.POST.role %}selected{% endif %}>Estudiante</option>
                                <option value="teacher" {% if request.POST.role == 'teacher' %}selected{% endif %}>Docente</option>
                                <option value="admin" {% if request.POST.role == 'admin' %}selected{% endif %}>Administrador</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Contraseña</label>
                            <input type="text" name="password" class="form-control" value="{{ request.POST.password|default:'' }}" required>
                            <div class="form-text">Mínimo 8 caracteres</div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                            <i class="fas fa-save me-2"></i> Crear usuario
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="{% url 'admin_users' %}" class="text-muted">
                            <i class="fas fa-arrow-left me-1"></i> Volver a la lista
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

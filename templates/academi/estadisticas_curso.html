{% extends 'partials/base.html' %}

{% block title %}Estadísticas - AcadEMI{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="fw-bold mb-4"><i class="fas fa-chart-bar" style="color: var(--primary);"></i> Estadísticas de cursos</h2>
    
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card shadow-lg border-0 text-center p-3">
                <h3 class="fw-bold text-primary">{{ courses|length }}</h3>
                <p class="text-muted">Total cursos</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-lg border-0 text-center p-3">
                <h3 class="fw-bold text-success">0</h3>
                <p class="text-muted">Estudiantes totales</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-lg border-0 text-center p-3">
                <h3 class="fw-bold text-warning">0%</h3>
                <p class="text-muted">Progreso promedio</p>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card shadow-lg border-0 text-center p-3">
                <h3 class="fw-bold text-danger">Bs. 0</h3>
                <p class="text-muted">Ingresos totales</p>
            </div>
        </div>
    </div>
    
    <div class="card shadow-lg border-0 mt-4">
        <div class="card-body">
            <p class="text-center text-muted py-4">
                <i class="fas fa-chart-line fa-2x d-block mb-2"></i>
                No hay datos disponibles aún
            </p>
        </div>
    </div>
</div>
{% endblock %}

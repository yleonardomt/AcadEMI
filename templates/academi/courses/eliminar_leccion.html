{% extends 'partials/base.html' %}
{% load static %}

{% block title %}Eliminar lección{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5 text-center">
                    <div class="mb-4">
                        <i class="fas fa-exclamation-triangle fa-3x" style="color: var(--danger);"></i>
                    </div>
                    <h4 class="fw-bold text-danger">Eliminar lección</h4>
                    <p class="text-muted mt-2">
                        ¿Estás seguro de eliminar la lección <strong>"{{ lesson.title }}"</strong>?
                    </p>
                    <div class="alert alert-danger">
                        <i class="fas fa-info-circle"></i>
                        Esta acción no se puede deshacer.
                    </div>
                    <div class="d-flex gap-3 mt-4 justify-content-center">
                        <form method="POST">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> Sí, eliminar
                            </button>
                        </form>
                        <a href="{% url 'manage_course' lesson.module.course.id %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

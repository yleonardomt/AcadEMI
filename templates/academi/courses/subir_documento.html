{% extends 'partials/base.html' %}

{% block title %}Subir documento - {{ lesson.title }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-file-pdf fa-2x" style="color: var(--danger);"></i>
                        <h4 class="mt-2 fw-bold">Subir documento</h4>
                        <p class="text-muted">Lección: <strong>{{ lesson.title }}</strong></p>
                    </div>
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">Documento <span class="text-danger">*</span></label>
                            <input type="file" name="document" class="form-control" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" required>
                            <div class="form-text">Formatos: PDF, DOC, DOCX, PPT, PPTX, XLS, XLSX</div>
                        </div>
                        <div class="d-flex gap-3 mt-4">
                            <button type="submit" class="btn btn-info flex-grow-1 text-white">
                                <i class="fas fa-upload"></i> Subir documento
                            </button>
                            <a href="{% url 'manage_course' lesson.module.course.id %}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

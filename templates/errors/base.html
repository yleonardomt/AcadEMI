<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{% block title %}AcadEMI{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/logo-mark.svg">
    <style>
        :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px; background: #f5f7fa; color: #18223b; }
        main { width: min(100%, 640px); text-align: center; }
        .brand { display: inline-flex; align-items: center; gap: 12px; padding: 6px 12px; border-radius: 10px; background: #02167f; color: #fff; text-decoration: none; font-size: 1.4rem; font-weight: 800; letter-spacing: -.04em; }
        .brand img { width: 44px; height: 44px; }
        .brand strong { color: #ffd014; }
        .code { display: block; margin: 44px 0 12px; color: #02167f; font-size: clamp(4.5rem, 12vw, 7rem); font-weight: 800; line-height: 1; letter-spacing: -.08em; }
        h1 { margin: 0 0 14px; font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -.04em; }
        p { margin: 0 auto 30px; max-width: 460px; color: #536078; line-height: 1.65; }
        .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .actions a { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; padding: 11px 22px; border-radius: 10px; font-weight: 700; text-decoration: none; }
        .primary { background: #02167f; color: #fff; }
        .secondary { border: 1px solid #aab4c6; color: #02167f; }
        @media (prefers-color-scheme: dark) {
            body { background: #111a2e; color: #f4f6fb; }
            .code { color: #a9c7ff; }
            .brand strong { color: #ffd014; }
            p { color: #b8c4d8; }
            .primary { background: #ffd014; color: #07184d; }
            .secondary { border-color: #7185a7; color: #dce7ff; }
        }
    </style>
</head>
<body>
    <main>
        <a class="brand" href="/"><img src="/static/images/logo-mark.svg" alt=""> Acad<strong>EMI</strong></a>
        <span class="code">{% block code %}{% endblock %}</span>
        <h1>{% block heading %}{% endblock %}</h1>
        <p>{% block explanation %}{% endblock %}</p>
        <div class="actions"><a class="primary" href="/">Volver al inicio</a><a class="secondary" href="/catalog/">Ver cursos</a></div>
    </main>
</body>
</html>
